# TripleA additions for every FlatLaf theme, registered in DefaultSubstanceLookAndFeelManager.
# Shapes, styles and the default highlight colors; theme colors are in TripleaDarkLaf.properties and
# TripleaLightLaf.properties.
# Keys: https://www.formdev.com/flatlaf/properties-files/

Button.arc = 10
Component.arc = 10
CheckBox.arc = 5
ProgressBar.arc = 10
TextComponent.arc = 8
SplitPaneDivider.style = plain

# The main action of a screen, eg "Start Game" or "Done":
# button.putClientProperty("FlatLaf.styleClass", "primary")
[style]Button.primary = \
	background: $Button.default.background; \
	foreground: $Button.default.foreground; \
	hoverBackground: $Button.default.hoverBackground; \
	pressedBackground: $Button.default.pressedBackground; \
	borderColor: $Button.default.borderColor; \
	hoverBorderColor: $Button.default.hoverBorderColor; \
	focusedBorderColor: $Button.default.focusedBorderColor; \
	font: bold

# The one color of the client, for the choice to advertise: the text of Multiplayer in the main
# menu (MenuEntry); for themes that do not set their own
TripleA.highlightBackground = #a0c4e8

# A raised, rounded area that groups what belongs together, eg the selected game:
# panel.putClientProperty("FlatLaf.styleClass", "card")
[style]Panel.card = \
	arc: 16; \
	background: $TextField.background
