# TripleA Dark: FlatLaf Dark on a near-black background, without colored accents. The only color
# is the highlight of Multiplayer in the main menu.

@background = #141318
@foreground = #e6e1e6
@accentColor = #9d9ba3

# The main action of a screen stands out by a lighter, quiet fill.
Button.default.background = #34333a
Button.default.foreground = #ffffff
Button.default.hoverBackground = #3e3d45
Button.default.pressedBackground = #2b2a30
Button.default.borderColor = #4a4950
Button.default.hoverBorderColor = $Button.default.borderColor
Button.default.focusedBorderColor = #9d9ba3
Button.default.borderWidth = 1

# Raised areas like cards and fields stand out from the background.
TextField.background = #211f26
List.background = #1b1a20
Table.background = #1b1a20

# The highlight keeps the light blue of FlatLaf.properties.
