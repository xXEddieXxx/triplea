# TripleA Light: FlatLaf Light on a calm, cool white background, without colored accents. The only
# color is the highlight of Multiplayer in the main menu.

@background = #f5f6f7
@accentColor = #6e6c74

# The main action of a screen stands out by a darker, quiet fill.
Button.default.background = #3a3940
Button.default.foreground = #ffffff
Button.default.borderColor = #2c2b31
Button.default.hoverBorderColor = $Button.default.borderColor
Button.default.focusedBorderColor = $Button.default.borderColor
Button.default.borderWidth = 1

# The highlight: dark indigo, readable as text on the light background.
TripleA.highlightBackground = #3b2e8c
